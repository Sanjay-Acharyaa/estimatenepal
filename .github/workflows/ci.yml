name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Type-check & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: "mysql://root:root@localhost:3306/nepaliestimate_ci"

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          # Stub env vars so Next.js build completes without real credentials
          DATABASE_URL: "mysql://root:root@localhost:3306/nepaliestimate_ci"
          NEXTAUTH_SECRET: "ci-secret-placeholder-32-chars-min"
          NEXTAUTH_URL: "http://localhost:3000"
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"
          RESEND_API_KEY: "re_placeholder"
          REDIS_URL: "redis://localhost:6379"
          STORAGE_ACCESS_KEY: "ci_placeholder"
          STORAGE_SECRET_KEY: "ci_placeholder"
