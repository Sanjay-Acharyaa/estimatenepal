name: Scheduled Jobs

on:
  schedule:
    # Run daily at 7:15 AM NPT (1:30 UTC — offset for Nepal Standard Time +5:45)
    - cron: "30 1 * * *"
  workflow_dispatch: # Allow manual trigger from GitHub Actions UI

jobs:
  trial-reminder:
    name: Trial lifecycle emails
    runs-on: ubuntu-latest
    steps:
      - name: Send trial reminder emails
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -L --max-redirs 3 -X GET \
            "https://estimatenepal.com/api/cron/trial-reminder" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          echo "Response status: $STATUS"
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 300 ]; then
            echo "Trial reminder emails sent successfully"
          elif [ "$STATUS" = "429" ]; then
            echo "Rate limited (already ran recently) — OK"
          else
            echo "Unexpected status: $STATUS"
            exit 1
          fi
